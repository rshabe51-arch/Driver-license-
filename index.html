<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--ac:#1f7a4d;--ok:#d9f2e3;--okb:#1f7a4d;--no:#fde0e0;--nob:#c0392b;--bd:#d8dde3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181c;--card:#1e242a;--tx:#eef1f4;--mu:#9aa5b1;--ac:#3fb67a;--ok:#1d4030;--okb:#3fb67a;--no:#47252a;--nob:#e5665a;--bd:#34404a}}
:root[data-theme="dark"]{--bg:#14181c;--card:#1e242a;--tx:#eef1f4;--mu:#9aa5b1;--ac:#3fb67a;--ok:#1d4030;--okb:#3fb67a;--no:#47252a;--nob:#e5665a;--bd:#34404a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Ethiopic","Nyala",system-ui,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px}
h1{font-size:1.6rem;margin:0 0 10px}
p{color:var(--mu);margin:0 0 16px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:600;width:100%}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:10px;padding:12px 14px;margin:10px 0}
.opt.ok{background:var(--ok);border-color:var(--okb)}
.opt.no{background:var(--no);border-color:var(--nob)}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem;margin-bottom:8px}
.fb{margin:14px 0;padding:12px;border-radius:10px;font-weight:600}
.fb.ok{background:var(--ok)}.fb.no{background:var(--no)}
.big{font-size:3rem;font-weight:700;color:var(--ac);text-align:center;margin:8px 0}
.hide{display:none}
.sign-box{display:flex;justify-content:center;margin:10px 0 14px}
.sign-box svg{width:110px;height:100px;overflow:visible}
</style>

var ALL=[
["ይህ የማስጠንቀቂያ ምልክት ምንን ያመለክታል?",["የሚከለክሉ ምልክቶች","የእግረኛ ማቋረጫ (Pedestrian crossing)","አስገዳጅ ምልክቶች","መረጃ ሰጪ ምልክቶች"],1,"pedestrian"],
["ይህ የማስጠንቀቂያ ምልክት ምንን ያመለክታል?",["ከፊት ለፊት አጠቃላይ አደጋ ወይም ልዩ ጥንቃቄ የሚያስፈልግ ቦታ መኖሩን","የመኪና ማቆሚያ ቦታ መኖሩን","የፍጥነት ገደብ ማብቃቱን","የአንድ አቅጣጫ መንገድ መኖሩን"],0,"danger"],
["ይህ የማስጠንቀቂያ ምልክት ምንን ያመለክታል?",["መንገድ ከሁለቱም ወገን እየጠበበ መሄዱን","የባቡር ሐዲድ ማቋረጫ መኖሩን","ሆስፒታል መኖሩን","መቅደም የተፈቀደ መሆኑን"],0,"narrows"],
["ይህ የማስጠንቀቂያ ምልክት ምንን ያመለክታል?",["ቀጥተኛ ድልድይ","ሹል ኩርባ / የመንገድ መታጠፍ","የመኪና ማጠቢያ","የነዳጅ ማደያ"],1,"curve"],
["ቀይ ጠርዝ ባለው እኩል ጎን ሦስት ማዕዘን ቅርጽ ውስጥ የሚገኙ የትራፊክ ምልክቶች በምን ምድብ ይመደባሉ?",["የሚከለክሉ ምልክቶች","የማስጠንቀቂያ ምልክቶች","አስገዳጅ ምልክቶች","መረጃ ሰጪ ምልክቶች"],1],
["ቀይ ጠርዝና ነጭ መደብ ያላቸው ክብ ምልክቶች በአጠቃላይ ምንን ያመለክታሉ?",["ወደ አቅራቢያ ከተሞች የሚወስዱ አቅጣጫዎችን","አሽከርካሪው በግዴታ ማድረግ ያለበትን ተግባር","አሽከርካሪው ማክበር ያለበትን ክልከላ ወይም ገደብ","ከፊት ለፊት የመንገድ ጥገና መኖሩን"],2],
["ሙሉ ሰማያዊ መደብና ነጭ ምስል ያለው ክብ ምልክት ለአሽከርካሪው ምንን ይነግራል?",["አሽከርካሪው በጥብቅ እንዲፈጽም የሚገደድበትን ተግባር","በአካባቢው ነፃ የመኪና ማቆሚያ መኖሩን","በአቅራቢያ ሆስፒታል መኖሩን","መቅደም የተከለከለ መሆኑን"],0],
["የመደበኛ ቁም (STOP) ምልክት ትክክለኛ ቅርጽ ምንድን ነው?",["ስድስት ጎን (Hexagon)","የተገለበጠ ሦስት ማዕዘን","ስምንት ጎን (Octagon)","አራት ጎን (Diamond)"],2],
["ጫፉ ወደ ታች የተገለበጠ ቀይ ጠርዝ ያለው ሦስት ማዕዘን ምልክት አሽከርካሪውን ምን እንዲያደርግ ያዛል?",["ከትራፊክ ጋር ለመቀላቀል ፍጥነት እንዲጨምር","ቅድሚያ ለሚገባቸው ተሽከርካሪዎች መንገድ እንዲለቅ (ቅድሚያ እንዲሰጥ)","ያለማቋረጥ ክላክስ እንዲያሰማ","ወዲያውኑ ወደ ኋላ እንዲመለስ"],1],
["አራት ማዕዘን ቅርጽ ያላቸው ሰማያዊ ወይም አረንጓዴ የመንገድ ምልክቶች በዋናነት የሚያገለግሉት ለምንድን ነው?",["ድንገተኛ የማቆም ትዕዛዝ ለመስጠት","ስለ መንገድ አቅጣጫዎች፣ ርቀቶችና አገልግሎቶች መረጃ ለመስጠት","ከፍተኛ የፍጥነት ገደብን ለማሳየት","ስለ ሹል ኩርባዎች ለማስጠንቀቅ"],1],
["የትራፊክ መብራት ብልጭ ድርግም የሚል ቢጫ መብራት ሲያሳይ ምን ማድረግ አለብዎት?",["ሙሉ በሙሉ ቆመው አረንጓዴ መብራት እስኪበራ መጠበቅ","መብራቱ ወደ ቀይ ከመቀየሩ በፊት ፍጥነት መጨመር","ፍጥነት ቀንሰው በጥንቃቄ መስቀለኛ መንገዱን ማለፍ","ወዲያውኑ ዩ-ተርን መውሰድ"],2],
["አንድ አሽከርካሪ ብልጭ ድርግም የሚል ቀይ የትራፊክ መብራትን እንዴት ማስተናገድ አለበት?",["መኪና ካልታየ እንደ አረንጓዴ መብራት መቁጠር","ልክ እንደ ቁም ምልክት፡ ሙሉ በሙሉ መቆም፣ ግራና ቀኝ ማየትና መንገዱ ነፃ ሲሆን ማለፍ","ሳይቆሙ ፍጥነትን ወደ 20 ኪ.ሜ/ሰ መቀነስ","የአደጋ መብራት አብርቶ በቀጥታ ማለፍ"],1],
["ቀይና ቢጫ የትራፊክ መብራቶች በአንድ ላይ ሲበሩ ምንን ያመለክታሉ?",["የትራፊክ መብራቱ መበላሸቱን","መብራቱ ወደ አረንጓዴ ሊቀየር መሆኑን፤ ቀድመው ሳይገቡ ለመንቀሳቀስ መዘጋጀት","እግረኞች በሰያፍ ማቋረጥ እንደሚችሉ","ከባድ የጭነት መኪኖች ብቻ ማለፍ እንደሚችሉ"],1],
["የሚሰራ የትራፊክ መብራትና የትራፊክ ፖሊስ በአንድ ላይ ባሉበት መስቀለኛ መንገድ የማን ትዕዛዝ ቅድሚያ አለው?",["የትራፊክ መብራቱ","መንገዱ ላይ የተቀቡ መስመሮች","የትራፊክ ፖሊሱ","ከቀኝ በኩል የሚመጣው ተሽከርካሪ"],2],
["የትራፊክ ፖሊስ አንድ እጁን ቀጥ አድርጎ ወደ ላይ ሲያነሳ ምን ማለት ነው?",["ከሁሉም አቅጣጫ የሚመጡ ተሽከርካሪዎች መቆም አለባቸው","ከኋላ የሚመጡ ተሽከርካሪዎች መቅደም ይችላሉ","መስቀለኛ መንገዱን ለመልቀቅ ፍጥነት መጨመር","ወደ ቀኝ ብቻ መታጠፍ"],0],
["ባለሁለት አቅጣጫ መንገድ መካከል ላይ ያለ ያልተቆራረጠ ድፍን ነጭ ወይም ቢጫ መስመር ምንን ያመለክታል?",["እይታው ጥሩ ሲሆን መቅደም እንደሚፈቀድ","ለመቅደም ወይም ለመታጠፍ መስመሩን መሻገር በጥብቅ የተከለከለ መሆኑን","መንገዱ የአንድ አቅጣጫ ብቻ መሆኑን","በግራ በኩል መኪና ማቆም እንደሚፈቀድ"],1],
["ሁለት ረድፎችን የሚለይ የተቆራረጠ ነጭ የመካከል መስመር ምንን ያመለክታል?",["ረድፍ መቀየር ፈጽሞ እንደማይቻል","ከፊት ያለው መንገድ ነፃና አስተማማኝ ከሆነ መስመሩን አቋርጦ መቅደም እንደሚቻል","ረድፉ ለአውቶቡሶች ብቻ የተከለከለ መሆኑን","ወደ ክፍያ ጣቢያ እየቀረቡ መሆኑን"],1],
["አንዱ ድፍን ሌላኛው የተቆራረጠ ድርብ የመካከል መስመር ባለበት ቦታ መስመሩን መሻገር የሚችሉት መቼ ነው?",["ድፍኑ መስመር በእርስዎ በኩል ሲሆን","የተቆራረጠው መስመር በእርስዎ በኩል ሲሆንና መንገዱ ነፃ ሲሆን","ከ60 ኪ.ሜ/ሰ በላይ ሲያሽከረክሩ","ዝናብ እየዘነበ ሲሆን"],1],
["ቀይ ጠርዝ ባለው ክብ ምልክት ውስጥ 50 የሚል ቁጥር ቢጻፍበት ምን ማለት ነው?",["ዝቅተኛው የፍጥነት ገደብ 50 ኪ.ሜ/ሰ ነው","ከፍተኛው የፍጥነት ገደብ 50 ኪ.ሜ/ሰ ነው","ቀጣዩ ከተማ 50 ኪ.ሜ ይርቃል","ከ50 ቶን በላይ የሚመዝኑ ተሽከርካሪዎች ይፈቀዳሉ"],1],
["ሰማያዊ ክብ ምልክት ውስጥ 30 የሚል ቁጥር ቢጻፍበት ምን ማለት ነው?",["ከፍተኛው የፍጥነት ገደብ 30 ኪ.ሜ/ሰ ነው","በመደበኛ የመንገድ ሁኔታ ዝቅተኛው የፍጥነት ገደብ 30 ኪ.ሜ/ሰ ነው","የመንገድ ቁጥር 30","የ30 ደቂቃ የማቆሚያ ገደብ"],1],
["ቀይ ጠርዝ ባለው ክብ ምልክት ውስጥ በክላክስ ምስል ላይ ቀይ ሰያፍ መስመር ቢኖርበት ምን ማለት ነው?",["እግረኞችን ለማስጠንቀቅ ክላክስ ያሰሙ","ከከፍተኛ አደጋ በስተቀር ክላክስ ማሰማት የተከለከለ ነው","የሙዚቃ መሳሪያዎች የተከለከሉ ናቸው","ትምህርት ቤት ስላለ ሁለት ጊዜ ክላክስ ያሰሙ"],1],
["ቀይ መደብና ነጭ ጠርዝ ባለው ክብ ምልክት መካከል አግድም ነጭ መስመር ቢኖርበት ምንን ያመለክታል?",["ለማንኛውም ተሽከርካሪ መግባት የተከለከለ (No Entry)","መንገዱ በሌሊት ብቻ ለጥገና ዝግ ነው","መኪና ማቆሚያ ያለው ዝግ መንገድ","ከፊት ለፊት የጉምሩክ ፍተሻ አለ"],0],
["ሰማያዊ መደብ፣ ቀይ ጠርዝና አንድ ቀይ ሰያፍ መስመር ያለው ክብ ምልክት ምንን ያመለክታል?",["በማንኛውም ጊዜ መቆምም ሆነ ማቆም የተከለከለ ነው","መኪና አቁሞ መሄድ የተከለከለ ነው (ለአጭር ጊዜ ሰው ማውረድ/መጫን ሊፈቀድ ይችላል)","የሁሉም የፍጥነት ገደቦች መጨረሻ","ከፊት ለፊት የአንድ አቅጣጫ መንገድ አለ"],1],
["ሰማያዊ መደብ፣ ቀይ ጠርዝና የተጣመረ ቀይ X ምልክት ያለው ክብ ምልክት ምንን ያመለክታል?",["ከፊት ለፊት መስቀለኛ መንገድ አለ","በማንኛውም ጊዜ መቆምም ሆነ ማቆም በጥብቅ የተከለከለ ነው","የሆስፒታል ድንገተኛ ክፍል መግቢያ","መዝጊያ የሌለው የባቡር ሐዲድ ማቋረጫ"],1],
["ጥቁር Y ወይም የሚቀላቀል ቀስት ምስል ያለበት ቀይ ሦስት ማዕዘን ምልክት አሽከርካሪውን ስለምን ያስጠነቅቃል?",["ከፊት ለፊት መንገድ መገናኛ ወይም የሚቀላቀል ትራፊክ መኖሩን","የሚያንሸራትት የመንገድ ገጽታ መኖሩን","የሚወድቁ ድንጋዮች መኖራቸውን","ዝቅ ብለው የሚበሩ አውሮፕላኖች መኖራቸውን"],0],
["ከኋላው የተጠማዘዘ የመንሸራተት ምልክት ያለበት መኪና ምስል የያዘ ቀይ ሦስት ማዕዘን ስለምን ያስጠነቅቃል?",["ከፊት ለፊት የመኪና ማጠቢያ መኖሩን","መንገዱ ሲረጥብ ወይም አቧራ ሲበዛበት የሚያንሸራትት መሆኑን","ጠመዝማዛ የተራራ መንገድ መኖሩን","ከፊት ለፊት የፍጥነት መቀነሻ ጉብታዎች መኖራቸውን"],1],
["ጥቁር ሰያፍ መስመር የተሰመረበት ነጭ ክብ ምልክት ምንን ያመለክታል?",["መንገዱ ለሁሉም ተሽከርካሪዎች ዝግ መሆኑን","ቀደም ብለው ተጥለው የነበሩ የአካባቢ የፍጥነትና የመቅደም ገደቦች ማብቃታቸውን","ለእግረኞች ብቻ የተፈቀደ መሆኑን","ቁልቁለታማ መንገድ መኖሩን"],1],
["መንገዱን አቋርጠው የተቀቡ ሰፋፊ ነጭ መስመሮች (የዜብራ ማቋረጫ) አሽከርካሪዎች ምን እንዲያደርጉ ያስገድዳሉ?",["እግረኞች መንገዱ ላይ ከመውጣታቸው በፊት ፍጥነት መጨመር","ፍጥነት ቀንሰው ለሚያቋርጡ ወይም ለማቋረጥ ለሚጠብቁ እግረኞች ቅድሚያ መስጠት","ከመስመሮቹ ጎን መኪና ማቆም","የቆሙ ተሽከርካሪዎችን በጥንቃቄ መቅደም"],1],
["በመንገድ ጠርዝ (ኬርብ) ላይ የተቀቡ ቢጫ ቀለሞች ወይም ቢጫ መስመሮች በአጠቃላይ ምንን ያመለክታሉ?",["ነፃ የሌሊት የመኪና ማቆሚያ","መቆም ወይም መኪና ማቆም ላይ የተጣሉ ገደቦችን","የብስክሌት መንገድ ብቻ መሆኑን","የድንገተኛ ብልሽት ማቆሚያ ቦታ"],1],
["በኢትዮጵያ ውስጥ ተሽከርካሪዎች በመንገዱ በየትኛው በኩል መንዳት አለባቸው?",["በግራ በኩል","በቀኝ በኩል","በመንገዱ መካከል","እንደ ትራፊኩ ብዛት በሁለቱም በኩል"],1],
["በመደበኛ የማሽከርከር ሁኔታ ሌላ ተንቀሳቃሽ ተሽከርካሪን መቅደም ያለብዎት በየትኛው በኩል ነው?",["በቀኝ በኩል","በግራ በኩል","በመንገዱ ጠርዝ (ትከሻ) በኩል","ሰፊ ቦታ ባለበት በማንኛውም በኩል"],1],
["በቀኝ በኩል መቅደም የሚፈቀደው መቼ ነው?",["ከፊት ያለው ተሽከርካሪ በዝግታ በሚጓዝበት ጊዜ ሁሉ","ከፊት ያለው አሽከርካሪ ወደ ግራ ለመታጠፍ ምልክት አሳይቶ ወደ ግራ ሲጠጋና በቀኝ በኩል በቂ አስተማማኝ ቦታ ሲኖር","ሹል የቀኝ ኩርባዎች ላይ","በዋሻ (ታንል) ውስጥ"],1],
["ምልክት ወይም የትራፊክ መብራት በሌለበት እኩል መንገዶች በሚገናኙበት መስቀለኛ መንገድ ላይ ቅድሚያ ያለው ማን ነው?",["ከግራ በኩል የሚመጣ ተሽከርካሪ","ከቀኝ በኩል የሚመጣ ተሽከርካሪ","ትልቁ ተሽከርካሪ","በፍጥነት የሚያሽከረክረው ተሽከርካሪ"],1],
["ወደ አደባባይ (ክብ መንገድ) ሲገቡ ምን ማድረግ አለብዎት?",["በአደባባዩ ውስጥ ካሉ ተሽከርካሪዎች ቀድመው ለመግባት ፍጥነት መጨመር","ቀድመው በአደባባዩ ውስጥ ለሚዞሩ ተሽከርካሪዎች ቅድሚያ መስጠት","በሰዓት አቅጣጫ (ወደ ግራ) መዞር","ሌሎች እንዲገቡ አደባባዩ ውስጥ መቆም"],1],
["በኢትዮጵያ ውስጥ ትራፊክ በአደባባይ ዙሪያ የሚዞረው በየትኛው አቅጣጫ ነው?",["በሰዓት አቅጣጫ (ወደ ግራ)","በተቃራኒ ሰዓት አቅጣጫ (ወደ ቀኝ)","በማንኛውም አቅጣጫ","መካከሉን አቋርጦ በቀጥታ"],1],
["ሁለት ተሽከርካሪዎች መተላለፍ በማይቻልበት ጠባብና ቁልቁለታማ የተራራ መንገድ ላይ ሲገናኙ ቅድሚያ መስጠት ወይም ወደ ኋላ መመለስ ያለበት የትኛው ነው?",["ዳገት የሚወጣው ተሽከርካሪ","ቁልቁለት የሚወርደው ተሽከርካሪ","ቀላል የቤት መኪና","ደማቅ መብራት ያለው ተሽከርካሪ"],1],
["የአምቡላንስ፣ የእሳት አደጋ መኪና ወይም የፖሊስ ተሽከርካሪ ሳይረን ሲያሰማ ወይም ብልጭ ድርግም የሚል መብራት ሲያበራ ወዲያውኑ ምን ማድረግ አለብዎት?",["ከፊቱ ቀድመው ለመሄድ ፍጥነት መጨመር","በጥንቃቄ ወደ መንገዱ ቀኝ ጠርዝ ተጠግተው እስኪያልፍ ድረስ መቆም","ትራፊክ ለማለፍ ከኋላው ተጠግቶ መከተል","መስቀለኛ መንገድ መካከል ላይ መቆም"],1],
["ከሚከተሉት ቦታዎች ውስጥ መቅደም በጥብቅ የተከለከለበት የትኛው ነው?",["የተቆራረጠ መስመር ባለባቸው ቀጥተኛ መንገዶች ላይ","እይታ በሚጋርዱ ኩርባዎች፣ የዳገት ጫፎች፣ የእግረኛ ማቋረጫዎችና መስቀለኛ መንገዶች ላይ","ባለብዙ ረድፍ የአንድ አቅጣጫ መንገዶች ላይ","ለ500 ሜትር ያህል ጥሩ እይታ ባላቸው መንገዶች ላይ"],1]
];
var app=document.getElementById("app"),i=0,score=0,locked=false;
function welcome(){
 i=0;score=0;
 var h='<h1>እንኳን ደህና መጡ!</h1><p>የኢትዮጵያ የመንጃ ፈቃድ የንድፈ ሐሳብ መለማመጃ ፈተና። ክፍል ይምረጡ፤ እያንዳንዱ ክፍል 10 ጥያቄዎች አሉት። ጥያቄዎች አንድ በአንድ ይቀርባሉ፣ ከመለሱ በኋላ ትክክለኛው መልስ ይታያል፣ በመጨረሻም ውጤትዎ ይገለጻል።</p>';
 for(var n=1;n<=10;n++){var c=ALL.slice((n-1)*10,n*10).length;h+='<button class="opt" data-n="'+n+'"'+(c?'':' disabled style="opacity:.5"')+'><b>ክፍል '+n+'</b> — ጥያቄ '+((n-1)*10+1)+'–'+n*10+(c<10?(c?' ('+c+' ጥያቄዎች ብቻ)':' (በቅርቡ)'):'')+'</button>';}
 app.innerHTML=h;
 app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){var n=+b.dataset.n;Q=ALL.slice((n-1)*10,n*10);i=0;score=0;show();};});
}
function show(){
 locked=false;var q=Q[i];
 var h='<div class="meta"><span>ጥያቄ '+(i+1)+' / '+Q.length+'</span><span>ነጥብ: '+score+'</span></div><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div>'+signSvg(q[3])+'<h2 style="font-size:1.15rem;margin:0 0 8px">'+q[0]+'</h2>';
 q[1].forEach(function(o,k){h+='<button class="opt" data-k="'+k+'"><b>'+L[k]+')</b> '+o+'</button>';});
 h+='<div id="fb"></div><button class="btn hide" id="nx"></button>';
 app.innerHTML=h;
 var bs=app.querySelectorAll(".opt");
 bs.forEach(function(b){b.onclick=function(){pick(+b.dataset.k,bs);};});
}
function pick(k,bs){
 if(locked)return;locked=true;
 var c=Q[i][2],right=k===c;
 if(right)score++;
 bs[c].classList.add("ok");
 if(!right)bs[k].classList.add("no");
 document.getElementById("fb").innerHTML='<div class="fb '+(right?'ok':'no')+'">'+(right?'✅ ትክክል ነው!':'❌ ስህተት ነው። ትክክለኛው መልስ፡ '+L[c]+') '+Q[i][1][c])+'</div>';
 var nx=document.getElementById("nx");
 nx.textContent=(i===Q.length-1)?"ውጤቴን አሳይ":"ቀጣይ ጥያቄ";
 nx.classList.remove("hide");
 nx.onclick=function(){i++;if(i<Q.length)show();else result();};
}
function result(){
 var p=Math.round(score/Q.length*100),pass=p>=70;
 app.innerHTML='<h1>ውጤትዎ</h1><div class="big">'+score+' / '+Q.length+'</div><p style="text-align:center">'+p+'%</p><div class="fb '+(pass?'ok':'no')+'">'+(pass?'🎉 እንኳን ደስ አለዎት! አልፈዋል።':'ገና ትንሽ ልምምድ ያስፈልጋል። እንደገና ይሞክሩ!')+'</div><button class="btn" id="re">እንደገና ጀምር</button>';
 document.getElementById("re").onclick=welcome;
}
welcome();
</script>
</body>
</html>
