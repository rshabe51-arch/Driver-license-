<title>የመንጃ ፈቃድ የንድፈ ሐሳብ ፈተና</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--ac:#1f7a4d;--ok:#d9f2e3;--okb:#1f7a4d;--no:#fde0e0;--nob:#c0392b;--bd:#d8dde3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181c;--card:#1e242a;--tx:#eef1f4;--mu:#9aa5b1;--ac:#3fb67a;--ok:#1d4030;--okb:#3fb67a;--no:#47252a;--nob:#e5665a;--bd:#34404a}}
:root[data-theme="dark"]{--bg:#14181c;--card:#1e242a;--tx:#eef1f4;--mu:#9aa5b1;--ac:#3fb67a;--ok:#1d4030;--okb:#3fb67a;--no:#47252a;--nob:#e5665a;--bd:#34404a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Ethiopic","Nyala",system-ui,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px}
h1{font-size:1.6rem;margin:0 0 10px}
p{color:var(--mu);margin:0 0 16px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:600;width:100%}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:10px;padding:12px 14px;margin:10px 0}
.opt.ok{background:var(--ok);border-color:var(--okb)}
.opt.no{background:var(--no);border-color:var(--nob)}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem;margin-bottom:8px}
.fb{margin:14px 0;padding:12px;border-radius:10px;font-weight:600}
.fb.ok{background:var(--ok)}.fb.no{background:var(--no)}
.big{font-size:3rem;font-weight:700;color:var(--ac);text-align:center;margin:8px 0}
.hide{display:none}
.sign-box{display:flex;justify-content:center;margin:10px 0 14px}
.sign-box svg{width:116px;height:106px;overflow:visible}
</style>
</head>
