<title>የመንጃ ፈቃድ የንድፈ ሐሳብ ፈተና</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--ac:#1f7a4d;--ok:#d9f2e3;--okb:#1f7a4d;--no:#fde0e0;--nob:#c0392b;--bd:#d8dde3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181c;--card:#1e242a;--tx:#eef1f4;--mu:#9aa5b1;--ac:#3fb67a;--ok:#1d4030;--okb:#3fb67a;--no:#47252a;--nob:#e5665a;--bd:#34404a}}
:root[data-theme="dark"]{--bg:#14181c;--card:#1e242a;--tx:#eef1f4;--mu:#9aa5b1;--ac:#3fb67a;--ok:#1d4030;--okb:#3fb67a;--no:#47252a;--nob:#e5665a;--bd:#34404a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Ethiopic","Nyala",system-ui,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px}
h1{font-size:1.6rem;margin:0 0 10px}
p{color:var(--mu);margin:0 0 16px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:600;width:100%}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:10px;padding:12px 14px;margin:10px 0}
.opt.ok{background:var(--ok);border-color:var(--okb)}
.opt.no{background:var(--no);border-color:var(--nob)}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem;margin-bottom:8px}
.fb{margin:14px 0;padding:12px;border-radius:10px;font-weight:600}
.fb.ok{background:var(--ok)}.fb.no{background:var(--no)}
.big{font-size:3rem;font-weight:700;color:var(--ac);text-align:center;margin:8px 0}
.hide{display:none}
.sign-box{display:flex;justify-content:center;margin:10px 0 14px}
.sign-box svg{width:116px;height:106px;overflow:visible}
</style>
</head>

["የአምቡላንስ፣ የእሳት አደጋ መኪና ወይም የፖሊስ ተሽከርካሪ ሳይረን ሲያሰማ ወይም ብልጭ ድርግም የሚል መብራት ሲያበራ ወዲያውኑ ምን ማድረግ አለብዎት?",["ከፊቱ ቀድመው ለመሄድ ፍጥነት መጨመር","በጥንቃቄ ወደ መንገዱ ቀኝ ጠርዝ ተጠግተው እስኪያልፍ ድረስ መቆም","ትራፊክ ለማለፍ ከኋላው ተጠግቶ መከተል","መስቀለኛ መንገድ መካከል ላይ መቆም"],1],
["ከሚከተሉት ቦታዎች ውስጥ መቅደም በጥብቅ የተከለከለበት የትኛው ነው?",["የተቆራረጠ መስመር ባለባቸው ቀጥተኛ መንገዶች ላይ","እይታ በሚጋርዱ ኩርባዎች፣ የዳገት ጫፎች፣ የእግረኛ ማቋረጫዎችና መስቀለኛ መንገዶች ላይ","ባለብዙ ረድፍ የአንድ አቅጣጫ መንገዶች ላይ","ለ500 ሜትር ያህል ጥሩ እይታ ባላቸው መንገዶች ላይ"],1],
["ይህ የማስጠንቀቂያ ምልክት ምንን ያመለክታል?",["መንገድ ከሁለቱም ወገን እየጠበበ መሄዱን","የባቡር ሐዲድ ማቋረጫ መኖሩን","ሆስፒታል መኖሩን","መቅደም የተፈቀደ መሆኑን"],0,"narrows"],
["ይህ የማስጠንቀቂያ ምልክት ምንን ያመለክታል?",["ከፊት ለፊት አጠቃላይ አደጋ ወይም ልዩ ጥንቃቄ የሚያስፈልግ ቦታ መኖሩን","የመኪና ማቆሚያ ቦታ መኖሩን","የፍጥነት ገደብ ማብቃቱን","የአንድ አቅጣጫ መንገድ መኖሩን"],0,"danger"],
["ይህ የማስጠንቀቂያ ምልክት ምንን ያመለክታል?",["ቀጥተኛ ድልድይ","ሹል ኩርባ / የመንገድ መታጠፍ","የመኪና ማጠቢያ","የነዳጅ ማደያ"],1,"curve"]
];

var app=document.getElementById("app"),i=0,score=0,locked=false;
function welcome(){
 i=0;score=0;
 var h='<h1>እንኳን ደህና መጡ!</h1><p>የኢትዮጵያ የመንጃ ፈቃድ የንድፈ ሐሳብ መለማመጃ ፈተና። ክፍል ይምረጡ፤ እያንዳንዱ ክፍል 10 ጥያቄዎች አሉት። ጥያቄዎች አንድ በአንድ ይቀርባሉ፣ ከመለሱ በኋላ ትክክለኛው መልስ ይታያል፣ በመጨረሻም ውጤትዎ ይገለጻል።</p>';
 for(var n=1;n<=10;n++){var c=ALL.slice((n-1)*10,n*10).length;h+='<button class="opt" data-n="'+n+'"'+(c?'':' disabled style="opacity:.5"')+'><b>ክፍል '+n+'</b> — ጥያቄ '+((n-1)*10+1)+'–'+n*10+(c<10?(c?' ('+c+' ጥያቄዎች ብቻ)':' (በቅርቡ)'):'')+'</button>';}
 app.innerHTML=h;
 app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){var n=+b.dataset.n;Q=ALL.slice((n-1)*10,n*10);i=0;score=0;show();};});
}
function show(){
 locked=false;var q=Q[i];
 var h='<div class="meta"><span>ጥያቄ '+(i+1)+' / '+Q.length+'</span><span>ነጥብ: '+score+'</span></div><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div>'+signSvg(q[3])+'<h2 style="font-size:1.15rem;margin:0 0 8px">'+q[0]+'</h2>';
 q[1].forEach(function(o,k){h+='<button class="opt" data-k="'+k+'"><b>'+L[k]+')</b> '+o+'</button>';});
 h+='<div id="fb"></div><button class="btn hide" id="nx"></button>';
 app.innerHTML=h;
 var bs=app.querySelectorAll(".opt");
 bs.forEach(function(b){b.onclick=function(){pick(+b.dataset.k,bs);};});
}
function pick(k,bs){
 if(locked)return;locked=true;
 var c=Q[i][2],right=k===c;
 if(right)score++;
 bs[c].classList.add("ok");
 if(!right)bs[k].classList.add("no");
 document.getElementById("fb").innerHTML='<div class="fb '+(right?'ok':'no')+'">'+(right?'✅ ትክክል ነው!':'❌ ስህተት ነው። ትክክለኛው መልስ፡ '+L[c]+') '+Q[i][1][c])+'</div>';
 var nx=document.getElementById("nx");
 nx.textContent=(i===Q.length-1)?"ውጤቴን አሳይ":"ቀጣይ ጥያቄ";
 nx.classList.remove("hide");
 nx.onclick=function(){i++;if(i<Q.length)show();else result();};
}
function result(){
 var p=Math.round(score/Q.length*100),pass=p>=70;
 app.innerHTML='<h1>ውጤትዎ</h1><div class="big">'+score+' / '+Q.length+'</div><p style="text-align:center">'+p+'%</p><div class="fb '+(pass?'ok':'no')+'">'+(pass?'🎉 እንኳን ደስ አለዎት! አልፈዋል።':'ገና ትንሽ ልምምድ ያስፈልጋል። እንደገና ይሞክሩ!')+'</div><button class="btn" id="re">እንደገና ጀምር</button>';
 document.getElementById("re").onclick=welcome;
}
welcome();
</script>
</body>
</html>
